<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="36" fill="#F7F8F7"/>
  <text x="800" y="95" text-anchor="middle" fill="#0F3363" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">
    From task framing to validated mock-up
  </text>
  <text x="800" y="145" text-anchor="middle" fill="#223A68" font-family="Arial, Helvetica, sans-serif" font-size="28" font-style="italic">
    Simulation-guided design of a simplified variable-stiffness finger actuator for repetitive finger motion
  </text>

  <line x1="160" y1="188" x2="690" y2="188" stroke="#7AA089" stroke-width="2"/>
  <line x1="910" y1="188" x2="1440" y2="188" stroke="#7AA089" stroke-width="2"/>
  <circle cx="780" cy="188" r="8" fill="#7AA089"/>
  <circle cx="800" cy="188" r="8" fill="#0F4C93"/>
  <circle cx="820" cy="188" r="8" fill="#7AA089"/>

  <defs>
    <filter id="shadow" x="0" y="0" width="2000" height="1200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#273246" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="40" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#0F4C93" stroke-width="2"/>
    <circle cx="58" cy="255" r="24" fill="#0F4C93"/>
    <text x="58" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1</text>
    <text x="147" y="308" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Finger tapping task</text>
    <line x1="72" y1="515" x2="223" y2="515" stroke="#0F4C93" stroke-width="2"/>
    <text x="72" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• Parkinson finger tapping</text>
    <text x="72" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• amplitude, timing, speed</text>
    <text x="72" y="640" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• variability, decrement</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#5A9575" stroke-width="2"/>
    <circle cx="318" cy="255" r="24" fill="#5A9575"/>
    <text x="318" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">2</text>
    <text x="408" y="304" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Task outputs from</text>
    <text x="408" y="336" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">assessment papers</text>
    <line x1="332" y1="515" x2="483" y2="515" stroke="#5A9575" stroke-width="2"/>
    <text x="332" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• direct finger-tapping papers</text>
    <text x="332" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• define assessment outputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#0F4C93" stroke-width="2"/>
    <circle cx="578" cy="255" r="24" fill="#0F4C93"/>
    <text x="578" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3</text>
    <text x="668" y="304" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Reduced-order</text>
    <text x="668" y="336" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">routing model</text>
    <line x1="592" y1="515" x2="743" y2="515" stroke="#0F4C93" stroke-width="2"/>
    <text x="592" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• planar MCP/PIP/DIP model</text>
    <text x="592" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• entry, guide, anchor</text>
    <text x="592" y="640" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• outputs: L(q), ΔL, dL/dq</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#5A9575" stroke-width="2"/>
    <circle cx="838" cy="255" r="24" fill="#5A9575"/>
    <text x="838" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">4</text>
    <text x="928" y="304" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Routing /</text>
    <text x="928" y="336" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">design scorecard</text>
    <line x1="852" y1="515" x2="1003" y2="515" stroke="#5A9575" stroke-width="2"/>
    <text x="852" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• compare routing layouts</text>
    <text x="852" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• ring count and placement</text>
    <text x="852" y="640" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• stroke and tendon tension</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#0F4C93" stroke-width="2"/>
    <circle cx="1098" cy="255" r="24" fill="#0F4C93"/>
    <text x="1098" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">5</text>
    <text x="1188" y="304" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Adjustable bench-top</text>
    <text x="1188" y="336" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">mock-up</text>
    <line x1="1112" y1="515" x2="1263" y2="515" stroke="#0F4C93" stroke-width="2"/>
    <text x="1112" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• distal thimble</text>
    <text x="1112" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• removable soft rings</text>
    <text x="1112" y="640" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• tendon transmission</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1340" y="250" width="215" height="450" rx="24" fill="#FEFEFD" stroke="#5A9575" stroke-width="2"/>
    <circle cx="1358" cy="255" r="24" fill="#5A9575"/>
    <text x="1358" y="265" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">6</text>
    <text x="1448" y="304" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Validation and</text>
    <text x="1448" y="336" text-anchor="middle" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">model update</text>
    <line x1="1372" y1="515" x2="1523" y2="515" stroke="#5A9575" stroke-width="2"/>
    <text x="1372" y="560" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• marker-tracked posture</text>
    <text x="1372" y="600" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• tendon stroke and tension</text>
    <text x="1372" y="640" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="18">• repeatability and mismatch</text>
  </g>

  <path d="M255 475H300" stroke="#0F4C93" stroke-width="4" stroke-linecap="round"/>
  <path d="M515 475H560" stroke="#0F4C93" stroke-width="4" stroke-linecap="round"/>
  <path d="M775 475H820" stroke="#0F4C93" stroke-width="4" stroke-linecap="round"/>
  <path d="M1035 475H1080" stroke="#0F4C93" stroke-width="4" stroke-linecap="round"/>
  <path d="M1295 475H1340" stroke="#0F4C93" stroke-width="4" stroke-linecap="round"/>

  <path d="M1462 700V760H720V700" stroke="#0F4C93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M720 760V710" stroke="#0F4C93" stroke-width="5" stroke-linecap="round"/>
  <path d="M980 760V710" stroke="#0F4C93" stroke-width="5" stroke-linecap="round"/>

  <rect x="185" y="790" width="1230" height="72" rx="18" fill="#FEFEFD" stroke="#7AA089" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="248" cy="826" r="22" fill="#0F4C93"/>
  <text x="248" y="834" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">i</text>
  <text x="294" y="835" fill="#102F59" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Simulation-first bench-top validation workflow — not a clinical treatment workflow and not a full glove deployment.
  </text>
</svg>
